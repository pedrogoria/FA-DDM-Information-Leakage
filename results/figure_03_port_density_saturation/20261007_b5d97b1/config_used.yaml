figure:
  id: figure_03_port_density_saturation
  title: Fixed-aperture vulnerability saturation

random:
  seed: 20260922

system:
  modulation: QPSK
  number_of_ports: [2, 4, 8, 16, 32]
  aperture_wavelengths: [0.5, 1.0, 2.0]
  transmit_power: 1.0
  noise_variance_eve: 0.1
  port_selection: uniform
  bob_angle_deg: 0.0
  eve_angle_deg: 30.0
  large_scale_gain_bob: 1.0
  large_scale_gain_eve: 1.0
  rician_factor_bob: 5.0
  rician_factor_eve: 5.0

fading:
  number_of_realizations: 50

quadrature:
  points_per_axis: 61
  noise_margin_sigma: 5.0
  batch_size: 20000

monte_carlo:
  enabled: true
  number_of_trials_per_realization: 5000
  confidence_level: 0.95

output:
  results_root: results
  experiment_name: figure_03_port_density_saturation
  dat_file: figure_03_port_density_saturation.dat
  pdf_file: figure_03_port_density_saturation_preview.pdf
  config_copy: config_used.yaml
