figure:
  id: figure_01_validation
  title: Quadrature and Monte Carlo validation

random:
  seed: 20260922

system:
  modulation: QPSK  # Options: BPSK, QPSK, 8PSK, 16PSK, 16QAM, 64QAM
  number_of_ports: 8
  aperture_wavelengths: 1.0
  transmit_power: 1.0
  port_selection: uniform
  bob_angle_deg: 0.0
  eve_angle_deg: 30.0
  large_scale_gain_bob: 1.0
  large_scale_gain_eve: 1.0
  rician_factor_bob: 5.0
  rician_factor_eve: 5.0

sweep:
  eve_snr_db: [-10, -5, 0, 5, 10, 15, 20]

quadrature:
  points_per_axis: 151
  noise_margin_sigma: 6.0
  batch_size: 20000

monte_carlo:
  number_of_trials: 100000
  confidence_level: 0.95

output:
  directory: data/results/figure_01_validation
  dat_file: figure_01_validation.dat
  pdf_file: figure_01_validation.pdf
  config_copy: config_used.yaml
